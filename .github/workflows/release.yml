name: Release

# Publishes to npm when a version tag is pushed, through npm trusted publishing
# (OIDC): no npm token is stored in the repository. The tag must equal the
# package.json version, and the full test suite runs before publishing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Tag must match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then echo "tag $TAG does not match package.json $version"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm publish --provenance --access public
